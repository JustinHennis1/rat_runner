name: cityrun
description: "Mobile game where you play as various characters running and fighting bosses."
publish_to: 'none'

version: 1.0.1+6

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flame: ^1.32.0
  flame_audio: ^2.11.12
  shared_preferences: ^2.5.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
  - assets/audio/
  - assets/images/
  - assets/characters/

  fonts:
    - family: Gamer
      fonts:
        - asset: assets/fonts/gamer-font/Gamer.otf
          style: normal
        - asset: assets/fonts/gamer-font/GamerDisplay.otf
          style: italic